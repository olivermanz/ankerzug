name: Validate and release desktop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      rust-toolchain: ${{ steps.version.outputs.rust-toolchain }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify matching release versions
        id: version
        shell: python
        run: |
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          frontend = json.loads(Path("package.json").read_text())["version"]
          tauri = json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"]
          cargo = tomllib.loads(Path("src-tauri/Cargo.toml").read_text())["package"]["version"]
          locked = next(p["version"] for p in tomllib.loads(
              Path("src-tauri/Cargo.lock").read_text()
          )["package"] if p["name"] == "ankerzug")
          if len({frontend, tauri, cargo, locked}) != 1:
              raise SystemExit("Frontend, Tauri, Cargo and Cargo.lock versions must match.")
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", frontend):
              raise SystemExit("Release version must be major.minor.patch without a prefix.")
          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={frontend}\n")
              output.write(f"rust-toolchain={toolchain}\n")
      - name: Require an unused release tag
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/v${RELEASE_VERSION}")
          if [ -n "$existing" ]; then
            echo "::error::Tag v${RELEASE_VERSION} already exists. Bump all version manifests before merging."
            exit 1
          fi
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            package-target: universal-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      RUST_TARGET: ${{ matrix.target }}
      PACKAGE_TARGET: ${{ matrix.package-target || matrix.target }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          architecture: ${{ startsWith(matrix.target, 'aarch64-') && 'arm64' || 'x64' }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.version.outputs.rust-toolchain }}-${{ matrix.target }}
          components: rustfmt, clippy
          targets: ${{ matrix.rust-targets || matrix.target }}
      - name: Verify native Rust host
        shell: python
        run: |
          import os
          import subprocess

          host = next(line.removeprefix("host: ") for line in
                      subprocess.check_output(["rustc", "-vV"], text=True).splitlines()
                      if line.startswith("host: "))
          if host != os.environ["RUST_TARGET"]:
              raise SystemExit(f"Expected native host {os.environ['RUST_TARGET']}, got {host}.")
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm libarchive-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - name: Fetch locked Rust dependencies for license verification
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm licenses:check
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm explore:test
      - run: pnpm rust:format
      - run: pnpm rust:test
      - run: pnpm rust:check
      - name: Compile and test optional native exploration infrastructure
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --features exploration exploration::tests
      - name: Build Tauri release packages
        if: matrix.bundles
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm desktop:build --target "$PACKAGE_TARGET" --bundles "$BUNDLES" -- --locked
      - name: Verify and stage release packages
        if: matrix.bundles
        shell: pwsh
        run: python .github/scripts/desktop-packages.py stage $env:RELEASE_VERSION $env:PACKAGE_TARGET
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.bundles
        with:
          name: ankerzug-${{ env.PACKAGE_TARGET }}
          if-no-files-found: error
          path: desktop-packages/
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: desktop-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ankerzug-*
          path: release-assets
      - name: Publish versioned release with all platform packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 .github/scripts/desktop-packages.py release "$RELEASE_VERSION" > "$RUNNER_TEMP/desktop-assets.txt"
          mapfile -t assets < "$RUNNER_TEMP/desktop-assets.txt"
          gh release create "v${RELEASE_VERSION}" "${assets[@]}" \
            --target "$RELEASE_COMMIT" \
            --title "Ankerzug ${RELEASE_VERSION}" \
            --generate-notes
